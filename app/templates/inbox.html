<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reefwise AI Receptionist</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background: #111;
            color: #f5f5f5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        .message-card {
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            background: #1a1a1a;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status {
            font-size: 12px;
            text-transform: uppercase;
            padding: 5px 10px;
            border: 1px solid #555;
            border-radius: 5px;
        }

        .phone {
            color: #bbb;
            margin-top: 4px;
        }

        .reason {
            margin-top: 20px;
            font-weight: bold;
        }

        .notes {
            color: #ccc;
            margin-top: 10px;
        }

        .timestamp {
            color: #777;
            margin-top: 20px;
            font-size: 13px;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            padding: 8px 14px;
            margin-right: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .empty {
            color: #999;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Reefwise</h1>

    <div class="subtitle">
        AI Receptionist Caller Messages
    </div>

    <div id="messages">
        Loading messages...
    </div>

</div>

<script>
    // Load all stored receptionist messages from the FastAPI backend.
    async function loadMessages() {
        const response = await fetch("/messages");
        const data = await response.json();

        const container = document.getElementById("messages");

        if (data.messages.length === 0) {
            container.innerHTML =
                '<div class="empty">No caller messages.</div>';

            return;
        }

        container.innerHTML = "";

        for (const message of data.messages) {
            const card = document.createElement("div");

            card.className = "message-card";

            card.innerHTML = `
                <div class="message-header">
                    <div>
                        <strong>${message.name}</strong>
                        <div class="phone">${message.phone}</div>
                    </div>

                    <div class="status">
                        ${message.status}
                    </div>
                </div>

                <div class="reason">
                    ${message.reason}
                </div>

                <div class="notes">
                    ${message.notes || ""}
                </div>

                <div class="timestamp">
                    ${new Date(message.created_at).toLocaleString()}
                </div>

                <div class="buttons">
                    <button onclick="changeStatus(
                        ${message.id},
                        'contacted'
                    )">
                        Mark Contacted
                    </button>

                    <button onclick="changeStatus(
                        ${message.id},
                        'closed'
                    )">
                        Close
                    </button>
                </div>
            `;

            container.appendChild(card);
        }
    }


    // Update message workflow status using the PATCH endpoint
    // already exposed by FastAPI.
    async function changeStatus(messageId, status) {
        await fetch(
            `/messages/${messageId}/status?status=${status}`,
            {
                method: "PATCH"
            }
        );

        // Reload the inbox so the updated status is visible immediately.
        await loadMessages();
    }


    // Load messages as soon as the page opens.
    loadMessages();
</script>

</body>
</html>
